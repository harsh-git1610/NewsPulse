services:
  - type: web
    name: newspulse-api
    runtime: node
    buildCommand: pip install -r scraper/requirements.txt && cd backend && npm install
    startCommand: cd backend && node app.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_BIN
        value: python3
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PORT
        value: 10000
